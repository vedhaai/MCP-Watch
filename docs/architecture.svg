<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 610" width="1230" height="610" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e6edf3"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#79a7ff"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0883e"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b392f0"/></marker>
  </defs>

  <rect width="1230" height="610" rx="12" fill="#0d1117"/>

  <!-- MCP client -->
  <rect x="20" y="130" width="150" height="90" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="95" y="162" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">MCP client</text>
  <text x="95" y="182" fill="#8b949e" font-size="12" text-anchor="middle">Claude · Cursor · any</text>
  <text x="95" y="200" fill="#8b949e" font-size="12" text-anchor="middle">no changes</text>

  <!-- Your MCP server -->
  <rect x="220" y="70" width="420" height="520" rx="12" fill="none" stroke="#30363d"/>
  <text x="238" y="95" fill="#e6edf3" font-size="14" font-weight="600">Your MCP server</text>
  <text x="358" y="95" fill="#8b949e" font-size="12">stdio or Streamable HTTP</text>

  <!-- Guard -->
  <rect x="240" y="110" width="380" height="250" rx="10" fill="#0f1620" stroke="#4c7bd9"/>
  <text x="256" y="132" fill="#79a7ff" font-size="13" font-weight="600">MCPWatch guard</text>
  <text x="372" y="132" fill="#8b949e" font-size="11">middleware or proxy</text>

  <rect x="260" y="145" width="220" height="55" rx="7" fill="#1a2740" stroke="#4c7bd9"/>
  <text x="370" y="168" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Engine</text>
  <text x="370" y="188" fill="#8b949e" font-size="11.5" text-anchor="middle">36 rules · score · mode · client lists</text>

  <rect x="495" y="145" width="110" height="55" rx="7" fill="#1f1a33" stroke="#8a6fd1"/>
  <text x="550" y="168" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">AI reviewer</text>
  <text x="550" y="187" fill="#8b949e" font-size="11" text-anchor="middle">on the message path</text>

  <rect x="260" y="225" width="120" height="55" rx="7" fill="#161b22" stroke="#30363d"/>
  <text x="320" y="247" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">Sessions</text>
  <text x="320" y="266" fill="#8b949e" font-size="11.5" text-anchor="middle">in memory · scores</text>

  <rect x="260" y="290" width="120" height="55" rx="7" fill="#161b22" stroke="#30363d"/>
  <text x="320" y="312" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">Pins + registry</text>
  <text x="320" y="331" fill="#8b949e" font-size="11.5" text-anchor="middle" font-family="Consolas, Menlo, monospace">~/.mcpwatch</text>

  <rect x="440" y="225" width="165" height="50" rx="7" fill="#161b22" stroke="#30363d"/>
  <text x="522" y="246" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">Event sender</text>
  <text x="522" y="264" fill="#8b949e" font-size="12" text-anchor="middle">background</text>

  <rect x="440" y="290" width="165" height="50" rx="7" fill="#161b22" stroke="#30363d"/>
  <text x="522" y="311" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">Settings poller</text>
  <text x="522" y="329" fill="#8b949e" font-size="12" text-anchor="middle">background</text>

  <!-- Your tools -->
  <rect x="240" y="450" width="380" height="90" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="430" y="488" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Your tools / the real server</text>
  <text x="430" y="508" fill="#8b949e" font-size="12" text-anchor="middle">registerTool handlers · or any server behind the proxy</text>

  <!-- Dashboard -->
  <rect x="740" y="110" width="300" height="480" rx="12" fill="none" stroke="#30363d"/>
  <text x="758" y="135" fill="#e6edf3" font-size="14" font-weight="600">MCPWatch dashboard</text>
  <text x="1022" y="135" fill="#8b949e" font-size="12" text-anchor="end" font-family="Consolas, Menlo, monospace">127.0.0.1:9100</text>

  <rect x="760" y="160" width="260" height="260" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="776" y="185" fill="#e6edf3" font-size="14" font-weight="600">Node HTTP server</text>

  <rect x="890" y="195" width="115" height="50" rx="7" fill="#0f1620" stroke="#4c7bd9"/>
  <text x="947" y="216" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">/api/*</text>
  <text x="947" y="234" fill="#8b949e" font-size="11" text-anchor="middle">login cookie</text>

  <rect x="770" y="230" width="110" height="115" rx="7" fill="#0f1620" stroke="#4c7bd9"/>
  <text x="825" y="280" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">/api/agent/*</text>
  <text x="825" y="298" fill="#8b949e" font-size="11" text-anchor="middle">project key</text>

  <text x="950" y="274" fill="#8b949e" font-size="12" text-anchor="middle">accounts · projects</text>
  <text x="950" y="292" fill="#8b949e" font-size="12" text-anchor="middle">requests · clients</text>
  <text x="950" y="310" fill="#8b949e" font-size="12" text-anchor="middle">mode · block · trust</text>
  <text x="950" y="328" fill="#8b949e" font-size="12" text-anchor="middle">AI review settings</text>
  <text x="950" y="346" fill="#8b949e" font-size="12" text-anchor="middle">Test AI</text>

  <rect x="760" y="480" width="260" height="85" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="890" y="507" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">JSON files</text>
  <text x="890" y="526" fill="#8b949e" font-size="12" text-anchor="middle" font-family="Consolas, Menlo, monospace">~/.mcpwatch/server/</text>
  <text x="890" y="546" fill="#8b949e" font-size="12" text-anchor="middle">users · sessions · projects · events</text>

  <!-- Ollama, Browser, scan, note -->
  <rect x="1080" y="95" width="135" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="1147" y="119" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Ollama</text>
  <text x="1147" y="137" fill="#8b949e" font-size="11" text-anchor="middle">qwen2.5:7b · :11434</text>
  <text x="1147" y="153" fill="#8b949e" font-size="11" text-anchor="middle">or any OpenAI-compatible</text>

  <rect x="1080" y="190" width="135" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="1147" y="214" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Browser · you</text>
  <text x="1147" y="233" fill="#8b949e" font-size="11" text-anchor="middle">dashboard page</text>
  <text x="1147" y="250" fill="#8b949e" font-size="11" text-anchor="middle">2 s refresh</text>
  <text x="1147" y="265" fill="#8b949e" font-size="11" text-anchor="middle">mode · Block / Trust</text>

  <rect x="1080" y="365" width="135" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="1147" y="390" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle" font-family="Consolas, Menlo, monospace">mcpwatch scan</text>
  <text x="1147" y="409" fill="#8b949e" font-size="11" text-anchor="middle">client configs · MS001–007</text>

  <rect x="1080" y="455" width="135" height="110" rx="8" fill="none" stroke="#8a6fd1" stroke-dasharray="4 3"/>
  <text x="1089" y="477" fill="#b392f0" font-size="11.5" font-weight="600">AI adds, never removes</text>
  <text x="1089" y="497" fill="#8b949e" font-size="11">Rules keep the final</text>
  <text x="1089" y="512" fill="#8b949e" font-size="11">say. A high AI finding</text>
  <text x="1089" y="527" fill="#8b949e" font-size="11">blocks before the tool</text>
  <text x="1089" y="542" fill="#8b949e" font-size="11">runs. Model down: the</text>
  <text x="1089" y="557" fill="#8b949e" font-size="11">rules alone decide.</text>

  <!-- Message in, refusal out -->
  <line x1="170" y1="162" x2="258" y2="162" stroke="#e6edf3" stroke-width="1.5" marker-start="url(#a-white)" marker-end="url(#a-white)"/>
  <text x="214" y="155" fill="#e6edf3" font-size="12" text-anchor="middle">JSON-RPC</text>
  <line x1="260" y1="185" x2="172" y2="185" stroke="#f0883e" stroke-width="1.5" marker-end="url(#a-orange)"/>
  <text x="216" y="203" fill="#f0883e" font-size="11" text-anchor="middle">−32001 blocked</text>
  <text x="216" y="218" fill="#f0883e" font-size="11" text-anchor="middle">−32002 throttled</text>

  <!-- Inside the guard -->
  <line x1="320" y1="202" x2="320" y2="223" stroke="#6e7681" stroke-width="1.5" marker-start="url(#a-grey)" marker-end="url(#a-grey)"/>
  <line x1="480" y1="172" x2="493" y2="172" stroke="#b392f0" stroke-width="1.5" marker-start="url(#a-purple)" marker-end="url(#a-purple)"/>
  <line x1="460" y1="200" x2="460" y2="223" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a-grey)"/>
  <text x="550" y="216" fill="#b392f0" font-size="10" text-anchor="middle">guard waits for verdict</text>

  <!-- Allowed down, results back up -->
  <line x1="400" y1="200" x2="400" y2="448" stroke="#3fb950" stroke-width="1.5" marker-end="url(#a-green)"/>
  <text x="392" y="410" fill="#3fb950" font-size="12" text-anchor="end">allowed</text>
  <line x1="425" y1="448" x2="425" y2="202" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#a-white)"/>
  <text x="433" y="402" fill="#e6edf3" font-size="12">results · tool lists</text>
  <text x="433" y="418" fill="#8b949e" font-size="11">checked: strip · redact · withhold</text>

  <!-- Guard to dashboard -->
  <line x1="605" y1="250" x2="768" y2="250" stroke="#79a7ff" stroke-width="1.5" marker-end="url(#a-blue)"/>
  <text x="688" y="236" fill="#79a7ff" font-size="11" text-anchor="middle">events, secrets redacted</text>
  <text x="688" y="268" fill="#79a7ff" font-size="11" text-anchor="middle">batched ~1 s</text>
  <line x1="770" y1="315" x2="607" y2="315" stroke="#79a7ff" stroke-width="1.5" marker-end="url(#a-blue)"/>
  <text x="688" y="333" fill="#79a7ff" font-size="11" text-anchor="middle">mode · block / trust lists ·</text>
  <text x="688" y="348" fill="#79a7ff" font-size="11" text-anchor="middle">AI settings, every 5 s</text>

  <!-- Server and files -->
  <line x1="890" y1="422" x2="890" y2="478" stroke="#e6edf3" stroke-width="1.5" marker-start="url(#a-white)" marker-end="url(#a-white)"/>
  <text x="900" y="454" fill="#e6edf3" font-size="12">reads / writes</text>

  <!-- Browser to dashboard API -->
  <line x1="1007" y1="220" x2="1078" y2="220" stroke="#e6edf3" stroke-width="1.5" marker-start="url(#a-white)" marker-end="url(#a-white)"/>
  <text x="1042" y="212" fill="#e6edf3" font-size="11" text-anchor="middle">JSON</text>

  <!-- Scan results -->
  <path d="M1078 395 H825 V347" fill="none" stroke="#79a7ff" stroke-width="1.5" marker-end="url(#a-blue)"/>
  <text x="955" y="387" fill="#79a7ff" font-size="11" text-anchor="middle">scan results</text>

  <!-- AI -->
  <path d="M1020 175 H1050 V130 H1078" fill="none" stroke="#b392f0" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-purple)"/>
  <text x="1056" y="122" fill="#b392f0" font-size="11" text-anchor="middle">Test AI</text>
  <path d="M550 143 V45 H1147 V93" fill="none" stroke="#b392f0" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#a-purple)" marker-end="url(#a-purple)"/>
  <text x="848" y="36" fill="#b392f0" font-size="12" text-anchor="middle">every tool call, tool definition and result · secrets masked · ~0.4–1 s per message</text>
</svg>
