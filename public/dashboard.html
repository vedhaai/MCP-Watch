<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCPWatch</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085; --line: #e3e6eb;
    --accent: #3056d3; --accent-text: #ffffff; --accent-bg: #eef2ff;
    --high: #c2352b; --high-bg: #fdecea; --medium: #a15c00; --medium-bg: #fff4e0; --low: #3056d3; --low-bg: #eef2ff;
    --ok: #1a7f4b; --ok-bg: #e7f6ee; --code: #f2f4f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1f27; --text: #e6e8ec; --muted: #98a2b3; --line: #2b313c;
      --accent: #6d8cff; --accent-text: #0b0e14; --accent-bg: #1d2540;
      --high: #f87171; --high-bg: #3a1a1a; --medium: #fbbf24; --medium-bg: #3a2c10; --low: #93a8ff; --low-bg: #1d2540;
      --ok: #4ade80; --ok-bg: #12301f; --code: #11151c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  header.top { display: flex; align-items: center; gap: 16px; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header.top h1 { font-size: 16px; margin: 0; }
  header.top h1 a { color: var(--text); }
  header.top .hint { margin-left: auto; color: var(--muted); font-size: 12px; }
  header.top .user { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .auth { max-width: 380px; margin: 60px auto; }
  .auth h2 { margin: 0 0 4px; font-size: 22px; }
  .auth input { width: 100%; }
  .auth .error { color: var(--high); background: var(--high-bg); padding: 8px 10px; border-radius: 6px; margin-top: 12px; font-size: 13px; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; }
  .wrap { padding: 20px 16px; max-width: 1300px; margin: 0 auto; }
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .bar h2 { margin: 0; font-size: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; overflow: auto; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; }
  button, .btn { padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; cursor: pointer; display: inline-block; }
  button.primary, .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--high); border-color: var(--high); }
  button.small { padding: 3px 8px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: default; }
  input, select, textarea { padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  .projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .project { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; color: var(--text); display: block; }
  .project:hover { border-color: var(--accent); }
  .project b { font-size: 15px; }
  .project .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .kinds { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .kind { border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer; }
  .kind.active { border-color: var(--accent); background: var(--accent-bg); }
  .kind b { display: block; margin-bottom: 4px; }
  .kind span { font-size: 12px; color: var(--muted); }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
  .tabs a { padding: 8px 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabs a.active { color: var(--accent); border-bottom-color: var(--accent); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; margin: 1px 2px 1px 0; white-space: nowrap; }
  .st-on { color: var(--ok); background: var(--ok-bg); }
  .st-wait { color: var(--medium); background: var(--medium-bg); }
  .st-off { color: var(--muted); background: var(--code); }
  .a-allow { color: var(--ok); background: var(--ok-bg); }
  .a-block, .a-strip { color: var(--high); background: var(--high-bg); }
  .a-throttle, .a-redact { color: var(--medium); background: var(--medium-bg); }
  .s-high { color: var(--high); background: var(--high-bg); }
  .s-medium { color: var(--medium); background: var(--medium-bg); }
  .s-low { color: var(--low); background: var(--low-bg); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .tile .n { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .l { font-size: 12px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 300px; gap: 16px; }
  .filters { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.ev { cursor: pointer; }
  tr.ev:hover td { background: var(--bg); }
  .detail td { background: var(--bg); }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .muted { color: var(--muted); }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  pre { background: var(--code); padding: 10px 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; margin: 6px 0; font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
  .code { position: relative; }
  .code button { position: absolute; top: 6px; right: 6px; }
  .code pre { padding-right: 64px; }
  .step { display: grid; grid-template-columns: 28px 1fr; gap: 12px; margin-bottom: 18px; }
  .step .num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-bg); color: var(--accent); font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .step h4 { margin: 3px 0 6px; font-size: 14px; }
  .step p { margin: 4px 0; color: var(--muted); font-size: 13px; }
  .status { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
  .status.wait { background: var(--medium-bg); color: var(--medium); }
  .status.on { background: var(--ok-bg); color: var(--ok); }
  .rule { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .rule:last-child { border-bottom: 0; }
  .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="top">
  <h1><a href="#/">MCPWatch</a></h1>
  <span class="hint" id="hint"></span>
  <span class="user" id="user" hidden><span id="username"></span><button class="small" id="logout">Sign out</button></span>
</header>
<div class="wrap" id="app"></div>

<script>
const app = document.getElementById("app");
let meta = { rules: [] };
let rules = {};
let timer = null;
const open = new Set();
const ui = { filter: "", text: "" };

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
async function api(path, opts = {}) {
  const method = opts.method || "GET";
  const res = await fetch(path, {
    method,
    // The server only accepts JSON for writes (protects against cross-site form posts).
    headers: method === "GET" ? {} : { "Content-Type": "application/json" },
    body: method === "GET" ? undefined : JSON.stringify(opts.body ?? {}),
  });
  const data = await res.json();
  if (res.status === 401 && !path.startsWith("/api/auth/")) {
    authPage(); // session expired or signed out elsewhere
    throw new Error("sign in required");
  }
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function showUser(user) {
  document.getElementById("user").hidden = !user;
  document.getElementById("hint").hidden = !user;
  document.getElementById("username").textContent = user ? user.username : "";
}

function authPage() {
  clearInterval(timer);
  showUser(null);
  let mode = "login";
  const render = (error = "") => {
    const login = mode === "login";
    app.innerHTML = `
      <form class="card auth" id="auth-form">
        <h2>${login ? "Sign in" : "Create account"}</h2>
        <p class="muted" style="margin-top:0">See every request that reaches your MCP servers, and stop the suspicious ones.</p>
        <label for="a-user">Username</label>
        <input id="a-user" autocomplete="username" autofocus>
        <label for="a-pass">Password</label>
        <input id="a-pass" type="password" autocomplete="${login ? "current-password" : "new-password"}">
        ${login ? "" : `<p class="note">At least 8 characters.</p>`}
        ${error ? `<div class="error">${esc(error)}</div>` : ""}
        <button class="primary" style="width:100%;margin-top:16px" id="a-submit">${login ? "Sign in" : "Create account"}</button>
        <p class="muted" style="text-align:center;font-size:13px">
          ${login ? "No account yet?" : "Already have an account?"}
          <button type="button" class="linkbtn" id="a-switch">${login ? "Create one" : "Sign in"}</button>
        </p>
      </form>`;
    document.getElementById("a-switch").onclick = () => { mode = login ? "register" : "login"; render(); };
    document.getElementById("auth-form").onsubmit = async (ev) => {
      ev.preventDefault();
      const btn = document.getElementById("a-submit");
      btn.disabled = true;
      try {
        const r = await api(`/api/auth/${login ? "login" : "register"}`, { method: "POST", body: {
          username: document.getElementById("a-user").value, password: document.getElementById("a-pass").value,
        } });
        await start(r.user);
      } catch (e) {
        const user = document.getElementById("a-user").value;
        render(e.message);
        document.getElementById("a-user").value = user;
        document.getElementById("a-pass").focus();
      }
    };
    document.getElementById("a-user").focus();
  };
  render();
}

function ago(iso) {
  if (!iso) return null;
  const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : `${Math.round(s / 3600)}h ago`;
}
function status(p) {
  if (!p.lastSeenAt) return { cls: "st-wait", text: "Waiting for first connection" };
  const s = (Date.now() - Date.parse(p.lastSeenAt)) / 1000;
  return s < 30 ? { cls: "st-on", text: "Connected" } : { cls: "st-off", text: `Last seen ${ago(p.lastSeenAt)}` };
}
const KINDS = {
  "middleware": ["Node.js / TypeScript MCP server", "Add one line to your server code. Any client that connects is scanned."],
  "proxy-stdio": ["Any local (stdio) MCP server", "For servers you can't edit (npx, uvx, Python…). Change the client config only."],
  "proxy-http": ["Any remote (HTTP) MCP server", "Run a local proxy in front of the server's URL."],
};
const MODES = {
  off: "Pass everything through, record nothing.",
  observe: "Never block. Record what Enforce would do. Good for a first look.",
  protect: "Block high-severity findings only.",
  enforce: "Block high-severity findings, then throttle and block by session score.",
};

function copyBlock(text) {
  return `<div class="code"><button class="small" data-copy="${esc(text)}">Copy</button><pre>${esc(text)}</pre></div>`;
}
function wireCopy() {
  app.querySelectorAll("[data-copy]").forEach((b) => (b.onclick = async () => {
    await navigator.clipboard.writeText(b.dataset.copy).catch(() => {});
    b.textContent = "Copied";
    setTimeout(() => (b.textContent = "Copy"), 1200);
  }));
}
function every(ms, fn) {
  clearInterval(timer);
  // A failed refresh (e.g. signed out) must not throw into the timer.
  const run = () => Promise.resolve().then(fn).catch(() => {});
  run();
  timer = setInterval(run, ms);
}

// ---------- pages ----------

async function projectsPage() {
  every(5000, async () => {
    const list = await api("/api/projects");
    app.innerHTML = `
      <div class="bar"><h2>Projects</h2><a class="btn primary" href="#/new" style="margin-left:auto">New project</a></div>
      ${list.length ? `<div class="projects">${list.map((p) => {
        const st = status(p);
        return `<a class="project" href="#/p/${p.id}/requests">
          <b>${esc(p.name)}</b>
          <div class="meta">${esc(KINDS[p.kind][0])}</div>
          <div class="meta"><span class="pill ${st.cls}">${st.text}</span> <span class="pill st-off">${p.mode}</span></div>
        </a>`;
      }).join("")}</div>` : `<div class="card empty">No projects yet. Create one to get a project key and the steps to connect your MCP server.</div>`}
      <p class="note">Guards running without a project key write to a local file: <a href="#/local">local events</a>.</p>`;
  });
}

function newProjectPage() {
  clearInterval(timer);
  let kind = "middleware";
  app.innerHTML = `
    <div class="bar"><h2>New project</h2></div>
    <div class="card">
      <label for="name">Project name</label>
      <input id="name" placeholder="e.g. Support tools server" style="width:100%;max-width:420px">
      <label>How is your MCP server built?</label>
      <div class="kinds">${Object.entries(KINDS).map(([k, [t, d]]) =>
        `<div class="kind${k === kind ? " active" : ""}" data-kind="${k}"><b>${t}</b><span>${d}</span></div>`).join("")}</div>
      <div style="margin-top:16px"><button class="primary" id="create">Create project</button> <span class="muted" id="err"></span></div>
    </div>`;
  app.querySelectorAll(".kind").forEach((el) => (el.onclick = () => {
    kind = el.dataset.kind;
    app.querySelectorAll(".kind").forEach((x) => x.classList.toggle("active", x === el));
  }));
  document.getElementById("create").onclick = async () => {
    const name = document.getElementById("name").value.trim();
    if (!name) return (document.getElementById("err").textContent = "Enter a name.");
    try {
      const p = await api("/api/projects", { method: "POST", body: { name, kind } });
      location.hash = `#/p/${p.id}/setup`;
    } catch (e) {
      document.getElementById("err").textContent = e.message;
    }
  };
  document.getElementById("name").focus();
}

function projectShell(p, tab) {
  const st = status(p);
  const tabs = [["requests", "Requests"], ["clients", "Clients"], ["settings", "Settings"], ["setup", "Setup"]];
  return `
    <div class="bar">
      <h2>${esc(p.name)}</h2>
      <span class="pill ${st.cls}">${st.text}</span>
      <span class="pill st-off">mode: ${p.mode}</span>
    </div>
    <nav class="tabs">${tabs.map(([k, l]) => `<a href="#/p/${p.id}/${k}" class="${k === tab ? "active" : ""}">${l}</a>`).join("")}</nav>
    <div id="body"></div>`;
}

function setupSteps(p) {
  const server = meta.server;
  const lib = meta.libPath;
  const cli = meta.cliPath.replace(/\\/g, "/");
  if (p.kind === "middleware") {
    return [
      ["Install MCPWatch in your MCP server project", copyBlock(`npm install "${lib}"`)],
      ["Add one line before connect()", copyBlock(
`import { mcpwatch } from "@vedhaai/mcpwatch";

const server = new McpServer({ name: "my-tools", version: "1.0.0" });
// ... server.registerTool(...) as usual

mcpwatch(server);   // ← add this line
await server.connect(transport);`)],
      ["Give it your project key", `<p>Set these where your server runs (PowerShell shown). Or pass them in code: <span class="mono">mcpwatch(server, { projectKey, server })</span>.</p>` +
        copyBlock(`$env:MCPWATCH_PROJECT_KEY = "${p.key}"\n$env:MCPWATCH_SERVER = "${server}"`)],
      ["Start your server and connect any MCP client", `<p>Nothing changes on the client side. Every request from any client shows up on the Requests tab.</p>`],
    ];
  }
  if (p.kind === "proxy-stdio") {
    const cfg = JSON.stringify({ "my-server": { command: "node", args: [cli, "--project-key", p.key, "--server", server, "--", "npx", "-y", "@modelcontextprotocol/server-filesystem", "C:/mcp-test"] } }, null, 2);
    return [
      ["Put MCPWatch in front of your server's command", `<p>In your MCP client's config (Claude Desktop, Cursor…), the command becomes <span class="mono">node cli.js … --</span> followed by your server's usual command. Example with the filesystem server:</p>` + copyBlock(cfg)],
      ["Or with Claude Code", copyBlock(`claude mcp add my-server -- node "${cli}" --project-key ${p.key} --server ${server} -- npx -y @modelcontextprotocol/server-filesystem C:/mcp-test`)],
      ["Restart the client and use the server", `<p>The proxy starts with the client and reports every request here.</p>`],
    ];
  }
  return [
    ["Run the proxy in front of your server's URL", copyBlock(`node "${cli}" http --listen 8800 --upstream https://your-server.example/mcp --project-key ${p.key} --server ${server}`)],
    ["Point your MCP client at the proxy", copyBlock("http://127.0.0.1:8800/mcp") + `<p>Use this URL in place of the server's real URL.</p>`],
    ["Use the server", `<p>Every request through the proxy shows up on the Requests tab.</p>`],
  ];
}

function setupTab(p) {
  const st = status(p);
  const on = st.cls === "st-on";
  const steps = setupSteps(p).map(([t, body], i) =>
    `<div class="step"><div class="num">${i + 1}</div><div><h4>${t}</h4>${body}</div></div>`).join("");
  const demoServer = `${meta.libPath.replace(/\\/g, "/")}/test/fixtures/demo-server/server.mjs`;
  const demo = p.kind === "middleware" ? `
    <div class="card">
      <h3>Try it with the demo server</h3>
      <p class="muted">MCPWatch ships a safe-to-attack demo server with the middleware built in. Any MCP client can use it.</p>
      <p class="muted"><b>stdio</b>, e.g. with Claude Code:</p>
      ${copyBlock(`claude mcp add mcpwatch-demo -e MCPWATCH_PROJECT_KEY=${p.key} -e MCPWATCH_SERVER=${meta.server} -- node "${demoServer}"`)}
      <p class="muted"><b>HTTP:</b> run this in a PowerShell terminal, then point any MCP client at <span class="mono">http://127.0.0.1:3001/mcp</span>:</p>
      ${copyBlock(`$env:MCPWATCH_PROJECT_KEY = "${p.key}"\n$env:MCPWATCH_SERVER = "${meta.server}"\nnode "${demoServer}" --http 3001`)}
    </div>` : "";
  return `
    <div class="status ${on ? "on" : "wait"}">
      <b>${on ? "Connected" : "Waiting for your MCP server…"}</b>
      <span>${on ? "Your guard is reporting to this project." : "This turns green when the guard first contacts the dashboard."}</span>
    </div>
    <div class="card">
      <h3>Project key</h3>
      ${copyBlock(p.key)}
      <p class="note">Keep it secret, like a password. New projects start in <b>${p.mode}</b> mode: ${MODES[p.mode]} Change it under Settings.</p>
    </div>
    <div class="card"><h3>Connect your MCP server</h3>${steps}</div>
    ${demo}`;
}

function flagged(e) { return e.findings.length > 0 || e.action !== "allow"; }

function requestsView(events) {
  const list = events.slice().reverse().filter((e) => {
    if (ui.filter === "flagged" && !flagged(e)) return false;
    if (ui.filter && ui.filter !== "flagged" && e.action !== ui.filter) return false;
    if (ui.text) {
      const hay = [e.method, e.tool, e.client, e.server, ...e.findings.map((f) => f.rule + " " + f.detail)].join(" ").toLowerCase();
      if (!hay.includes(ui.text.toLowerCase())) return false;
    }
    return true;
  });
  const calls = events.filter((e) => e.method === "tools/call" && e.direction === "client->server");
  const tiles = [
    [events.length, "Messages checked"],
    [calls.length, "Tool calls"],
    [events.filter(flagged).length, "Flagged"],
    [events.filter((e) => ["block", "throttle", "strip"].includes(e.action)).length, "Blocked / removed"],
    [events.filter((e) => e.action === "redact").length, "Redacted"],
    [events.filter((e) => e.action === "allow" && e.enforceAction !== "allow").length, "Would block (observe)"],
    [new Set(events.map((e) => e.client)).size, "Clients"],
  ];
  const rows = list.slice(0, 300).map((e) => {
    const k = `${e.time}|${e.session}|${e.direction}|${e.id}|${e.method}`;
    const fs = e.findings.map((f) => `<span class="pill s-${f.severity}" title="${esc(rules[f.rule]?.title || "")}${f.source === "ai" ? " (AI)" : ""}">${f.rule}${f.source === "ai" ? " ✦" : ""}</span>`).join("");
    const note = e.clientRule ? `<div class="muted" style="font-size:11px">client ${e.clientRule === "block" ? "blocked" : "trusted"}</div>`
      : e.action !== e.enforceAction ? `<div class="muted" style="font-size:11px">enforce: ${e.enforceAction}</div>` : "";
    let html = `<tr class="ev" data-k="${esc(k)}">
      <td class="mono muted">${new Date(e.time).toLocaleTimeString()}</td>
      <td class="muted">${e.direction === "client->server" ? "→ server" : e.direction === "local" ? "scan" : "← client"}</td>
      <td><span class="mono">${esc(e.method)}</span>${e.tool ? ` · <b>${esc(e.tool)}</b>` : ""}<div class="muted" style="font-size:11px">${esc(e.client)}</div></td>
      <td><span class="pill a-${e.action}">${e.action}</span>${note}</td>
      <td>${fs || '<span class="muted">—</span>'}</td>
      <td class="mono">${e.score}</td></tr>`;
    if (open.has(k)) {
      const ai = e.ai ? `<div class="muted" style="font-size:12px;margin-top:4px">AI review (${esc(e.ai.model)}): <b>${esc(e.ai.verdict)}</b> · ${e.ai.cached ? "cached" : `${e.ai.ms} ms`}${e.ai.error ? ` · ${esc(e.ai.error)}` : ""}</div>` : "";
      const fl = e.findings.map((f) => `<div style="margin:4px 0"><span class="pill s-${f.severity}">${f.rule}${f.source === "ai" ? " ✦" : ""}</span> ${esc(rules[f.rule]?.title || "")}<div class="muted">${esc(f.detail)}${f.where ? ` · <span class="mono">${esc(f.where)}</span>` : ""}</div></div>`).join("");
      html += `<tr class="detail"><td colspan="6">
        <div class="muted" style="font-size:12px">Server: <span class="mono">${esc(e.server)}</span> · Session: <span class="mono">${esc(e.session)}</span> · id ${esc(e.id)} · mode ${esc(e.mode)}</div>
        ${ai}${fl}${e.snippet ? `<pre>${esc(e.snippet)}</pre>` : ""}</td></tr>`;
    }
    return html;
  }).join("");
  const counts = {};
  events.forEach((e) => e.findings.forEach((f) => (counts[f.rule] = (counts[f.rule] || 0) + 1)));
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  return `
    <div class="tiles">${tiles.map(([n, l]) => `<div class="tile"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("")}</div>
    <div class="grid">
      <div class="card">
        <div class="filters">
          <select id="f-action">${[["", "All actions"], ["flagged", "Flagged only"], ["block", "Blocked"], ["throttle", "Throttled"], ["strip", "Tools removed"], ["redact", "Redacted"], ["allow", "Allowed"]]
            .map(([v, l]) => `<option value="${v}"${ui.filter === v ? " selected" : ""}>${l}</option>`).join("")}</select>
          <input id="f-text" placeholder="Filter by tool, method, client, rule…" value="${esc(ui.text)}">
        </div>
        <table><thead><tr><th>Time</th><th>Dir</th><th>Method / tool</th><th>Action</th><th>Findings</th><th>Score</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="6" class="empty">No requests yet.</td></tr>`}</tbody></table>
      </div>
      <div class="card"><h3>Top rules hit</h3>${top.length ? top.map(([id, n]) =>
        `<div class="rule"><span><span class="pill s-${rules[id]?.severity || "low"}">${id}</span> ${esc(rules[id]?.title || "")}</span><b class="mono">${n}</b></div>`).join("") : `<div class="empty">No findings yet.</div>`}</div>
    </div>`;
}

function wireRequests(rerender) {
  const fa = document.getElementById("f-action");
  const ft = document.getElementById("f-text");
  fa.onchange = () => { ui.filter = fa.value; rerender(); };
  ft.oninput = () => { ui.text = ft.value; rerender(); ft.focus(); ft.setSelectionRange(ft.value.length, ft.value.length); };
  app.querySelectorAll("tr.ev").forEach((tr) => (tr.onclick = () => {
    open.has(tr.dataset.k) ? open.delete(tr.dataset.k) : open.add(tr.dataset.k);
    rerender();
  }));
}

function clientsTab(p, events) {
  // Grouped by client name (without version), which is what block / trust lists match on.
  const by = new Map();
  for (const e of events) {
    if (e.direction === "local") continue; // scan results, not a connected client
    const id = e.clientName || e.client || "unknown";
    const c = by.get(id) || { id, name: e.client || id, sessions: new Set(), messages: 0, flagged: 0, blocked: 0, last: e.time };
    c.sessions.add(e.session);
    c.messages++;
    if (flagged(e)) c.flagged++;
    if (e.direction === "client->server" && e.action === "block") c.blocked++;
    if (e.time > c.last) c.last = e.time;
    by.set(id, c);
  }
  const rows = [...by.values()].sort((a, b) => b.last.localeCompare(a.last)).map((c) => {
    const id = c.id;
    const rule = p.clients.block.includes(id) ? "block" : p.clients.allow.includes(id) ? "allow" : "";
    return `<tr>
      <td><b>${esc(c.name)}</b>${rule ? ` <span class="pill ${rule === "block" ? "a-block" : "a-allow"}">${rule === "block" ? "blocked" : "trusted"}</span>` : ""}</td>
      <td class="mono">${c.sessions.size}</td><td class="mono">${c.messages}</td><td class="mono">${c.flagged}</td><td class="mono">${c.blocked}</td>
      <td class="muted">${ago(c.last)}</td>
      <td style="white-space:nowrap">
        <button class="small" data-rule="block" data-client="${esc(id)}"${rule === "block" ? " disabled" : ""}>Block</button>
        <button class="small" data-rule="allow" data-client="${esc(id)}"${rule === "allow" ? " disabled" : ""}>Trust</button>
        <button class="small" data-rule="" data-client="${esc(id)}"${rule ? "" : " disabled"}>Reset</button>
      </td></tr>`;
  }).join("");
  return `<div class="card">
    <p class="muted" style="margin-top:0">MCP clients that connected to this project's server. <b>Block</b> refuses everything from a client; <b>Trust</b> lets it through even when rules match. Applies within 5 seconds, in every mode.</p>
    <table><thead><tr><th>Client</th><th>Sessions</th><th>Messages</th><th>Flagged</th><th>Blocked</th><th>Last seen</th><th></th></tr></thead>
    <tbody>${rows || `<tr><td colspan="7" class="empty">No clients yet.</td></tr>`}</tbody></table></div>`;
}

async function setClientRule(p, client, rule) {
  const block = p.clients.block.filter((c) => c !== client);
  const allow = p.clients.allow.filter((c) => c !== client);
  if (rule === "block") block.push(client);
  if (rule === "allow") allow.push(client);
  return api(`/api/projects/${p.id}`, { method: "PATCH", body: { clients: { block, allow } } });
}

function settingsTab(p) {
  return `
    <div class="card">
      <h3>Mode</h3>
      ${Object.entries(MODES).map(([m, d]) => `<label style="display:flex;gap:8px;align-items:flex-start;color:var(--text);font-size:14px;margin:8px 0">
        <input type="radio" name="mode" value="${m}"${p.mode === m ? " checked" : ""} style="margin-top:4px"><span><b>${m}</b> <span class="muted">— ${d}</span></span></label>`).join("")}
      <h3 style="margin-top:20px">Scoring</h3>
      <div class="form-row">
        <div><label for="s-window">Window (seconds)</label><input id="s-window" type="number" min="1" value="${p.windowSeconds}"></div>
        <div><label for="s-throttle">Throttle at score</label><input id="s-throttle" type="number" min="1" value="${p.throttleAt}"></div>
        <div><label for="s-block">Block at score</label><input id="s-block" type="number" min="1" value="${p.blockAt}"></div>
      </div>
      <label for="s-deny">Denied tools (comma separated)</label>
      <input id="s-deny" style="width:100%" value="${esc(p.denyTools.join(", "))}" placeholder="e.g. run_command, delete_file">
      <h3 style="margin-top:20px">AI review</h3>
      <p class="note" style="margin-top:4px">An AI model can review every message on top of the rules. It can only add findings, never clear a rule's. If the model is down or too slow, the rules alone decide.</p>
      ${Object.entries(AI_CHOICES).map(([v, [title, d]]) => `<label style="display:flex;gap:8px;align-items:flex-start;color:var(--text);font-size:14px;margin:8px 0">
        <input type="radio" name="ai" value="${v}"${p.ai.provider === v ? " checked" : ""} style="margin-top:4px"><span><b>${title}</b> <span class="muted">— ${d}</span></span></label>`).join("")}
      <div id="ai-local" style="margin:8px 0 0 24px"${p.ai.provider === "local" ? "" : " hidden"}>
        <div class="form-row">
          <div><label for="ai-local-url">Server URL</label><input id="ai-local-url" value="${esc(p.ai.provider === "local" ? p.ai.url : "")}" placeholder="http://127.0.0.1:11434/v1 (Ollama)"></div>
          <div><label for="ai-local-model">Model</label><input id="ai-local-model" value="${esc(p.ai.provider === "local" ? p.ai.model : "")}" placeholder="qwen2.5:7b"></div>
        </div>
        <p class="note" style="margin-top:4px">Leave both empty for Ollama with qwen2.5:7b. Works with any OpenAI-compatible local server (LM Studio, llama.cpp, vLLM). Nothing leaves the machine.</p>
      </div>
      <div id="ai-api" style="margin:8px 0 0 24px"${p.ai.provider === "api" ? "" : " hidden"}>
        <label for="ai-preset">Provider</label>
        <select id="ai-preset">${AI_PROVIDERS.map(([name, url], i) => `<option value="${i}"${p.ai.provider === "api" && p.ai.url === url ? " selected" : ""}>${esc(name)}</option>`).join("")}</select>
        <div class="form-row" style="margin-top:8px">
          <div><label for="ai-api-url">API URL</label><input id="ai-api-url" value="${esc(p.ai.provider === "api" ? p.ai.url : "")}" placeholder="https://…/v1"></div>
          <div><label for="ai-api-model">Model</label><input id="ai-api-model" value="${esc(p.ai.provider === "api" ? p.ai.model : "")}" placeholder="model name"></div>
        </div>
        <label for="ai-api-key">API key</label>
        <input id="ai-api-key" type="password" autocomplete="off" style="width:100%;max-width:420px" placeholder="${p.ai.keySet ? `Saved (${esc(p.ai.keyHint)}). Leave empty to keep it` : "Paste your API key"}">
        <p class="note" style="margin-top:4px">Any OpenAI-compatible API. Model names are suggestions; use any model your account has. Messages are sent to this provider with secrets masked. The key is stored by this dashboard and passed to the project's guards; it is never shown again here.</p>
      </div>
      <div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button id="ai-test">Test AI</button> <span class="muted" id="ai-result" style="font-size:13px"></span></div>
      <h3 style="margin-top:20px">Transport (HTTP servers)</h3>
      <label for="s-origins">Allowed web origins (comma separated)</label>
      <input id="s-origins" style="width:100%" value="${esc((p.allowedOrigins || []).join(", "))}" placeholder="e.g. https://app.example.com">
      <p class="note" style="margin-top:4px">Browser requests from any other origin are refused (MW030, stops DNS rebinding). Clients that aren't browsers send no origin and are unaffected.</p>
      <label style="display:flex;gap:8px;align-items:center;color:var(--text);font-size:14px;margin:12px 0">
        <input type="checkbox" id="s-auth"${p.requireAuth ? " checked" : ""}> Require an Authorization or X-API-Key header (MW031)</label>
      <label for="s-aud">Expected token audience</label>
      <input id="s-aud" style="width:100%;max-width:420px" value="${esc(p.expectedAudience || "")}" placeholder="e.g. https://mcp.example.com">
      <p class="note" style="margin-top:4px">JWT bearer tokens issued for another service, or expired, are refused (MW036). Leave empty to skip the audience check.</p>
      <div style="margin-top:16px"><button class="primary" id="save">Save</button> <span class="muted" id="saved"></span></div>
      <p class="note">Guards pick up changes within 5 seconds. No restart needed.</p>
    </div>
    <div class="card">
      <h3>Project</h3>
      <label for="s-name">Name</label>
      <input id="s-name" value="${esc(p.name)}" style="width:100%;max-width:420px">
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button id="rename">Rename</button>
        <button id="rotate">Rotate key</button>
        <button id="clear">Clear requests</button>
        <button class="danger" id="delete">Delete project</button>
      </div>
      <p class="note">Rotating the key disconnects guards using the old one until you give them the new key.</p>
    </div>`;
}

const AI_CHOICES = {
  off: ["Rules only", "No AI. Every message is handled by the rules."],
  local: ["Local model", "Ollama or another model server on this machine."],
  api: ["Model with an API key", "A hosted model such as OpenAI, Claude or Gemini."],
};
// [name, OpenAI-compatible URL, suggested model]
const AI_PROVIDERS = [
  ["Custom", "", ""],
  ["OpenAI", "https://api.openai.com/v1", "gpt-4o-mini"],
  ["Anthropic (Claude)", "https://api.anthropic.com/v1", "claude-haiku-5-5"],
  ["Google Gemini", "https://generativelanguage.googleapis.com/v1beta/openai", "gemini-2.0-flash"],
  ["Groq", "https://api.groq.com/openai/v1", "llama-3.3-70b-versatile"],
  ["OpenRouter", "https://openrouter.ai/api/v1", "openai/gpt-4o-mini"],
];

function wireSettings(p) {
  const $ = (id) => document.getElementById(id);
  const aiForm = () => {
    const provider = app.querySelector("input[name=ai]:checked").value;
    if (provider === "local") return { provider, url: $("ai-local-url").value, model: $("ai-local-model").value };
    if (provider === "api") return { provider, url: $("ai-api-url").value, model: $("ai-api-model").value, apiKey: $("ai-api-key").value };
    return { provider };
  };
  app.querySelectorAll("input[name=ai]").forEach((r) => (r.onchange = () => {
    $("ai-local").hidden = r.value !== "local";
    $("ai-api").hidden = r.value !== "api";
    $("ai-result").textContent = "";
  }));
  $("ai-preset").onchange = () => {
    const [, url, model] = AI_PROVIDERS[$("ai-preset").value];
    $("ai-api-url").value = url;
    $("ai-api-model").value = model;
  };
  $("ai-test").onclick = async () => {
    $("ai-result").textContent = "Testing… (a local model may take a while to load)";
    try {
      const r = await api(`/api/projects/${p.id}/ai-test`, { method: "POST", body: aiForm() });
      $("ai-result").textContent = r.message ? r.message
        : !r.ok ? `Failed: ${r.error}`
        : `${r.model} answered in ${r.ms} ms and ${r.caught ? "caught" : "missed"} a sample command injection. ${r.caught ? "" : "It works, but consider a stronger model."}`;
    } catch (e) {
      $("ai-result").textContent = e.message;
    }
  };
  $("save").onclick = async () => {
    try {
      await api(`/api/projects/${p.id}`, { method: "PATCH", body: {
        mode: app.querySelector("input[name=mode]:checked").value,
        windowSeconds: $("s-window").value, throttleAt: $("s-throttle").value, blockAt: $("s-block").value,
        denyTools: $("s-deny").value.split(",").map((s) => s.trim()).filter(Boolean),
        allowedOrigins: $("s-origins").value.split(",").map((s) => s.trim()).filter(Boolean),
        requireAuth: $("s-auth").checked,
        ai: aiForm(),
        expectedAudience: $("s-aud").value,
      } });
      $("saved").textContent = "Saved.";
      route();
    } catch (e) {
      $("saved").textContent = e.message;
    }
  };
  $("rename").onclick = async () => { await api(`/api/projects/${p.id}`, { method: "PATCH", body: { name: $("s-name").value } }); route(); };
  $("rotate").onclick = async () => {
    if (!confirm("Rotate the project key? Guards using the old key stop reporting until updated.")) return;
    await api(`/api/projects/${p.id}/rotate-key`, { method: "POST" });
    location.hash = `#/p/${p.id}/setup`;
  };
  $("clear").onclick = async () => {
    if (!confirm("Delete all stored requests for this project?")) return;
    await api(`/api/projects/${p.id}/events`, { method: "DELETE" });
    location.hash = `#/p/${p.id}/requests`;
  };
  $("delete").onclick = async () => {
    if (!confirm(`Delete project "${p.name}" and its requests? Guards using its key stop reporting.`)) return;
    await api(`/api/projects/${p.id}`, { method: "DELETE" });
    location.hash = "#/";
  };
}

async function projectPage(id, tab) {
  let p;
  try {
    p = await api(`/api/projects/${id}`);
  } catch (e) {
    if (e.message === "sign in required") return;
    clearInterval(timer);
    app.innerHTML = `<div class="card empty">Project not found. <a href="#/">Back to projects</a></div>`;
    return;
  }
  app.innerHTML = projectShell(p, tab);
  const body = () => document.getElementById("body");

  if (tab === "settings") {
    clearInterval(timer);
    body().innerHTML = settingsTab(p);
    wireSettings(p);
    return;
  }
  if (tab === "setup") {
    every(2000, async () => {
      p = await api(`/api/projects/${id}`);
      app.innerHTML = projectShell(p, tab);
      body().innerHTML = setupTab(p);
      wireCopy();
    });
    return;
  }
  let events = [];
  const render = () => {
    app.innerHTML = projectShell(p, tab);
    if (tab === "clients") {
      body().innerHTML = clientsTab(p, events);
      app.querySelectorAll("[data-client]").forEach((b) => (b.onclick = async () => {
        p = await setClientRule(p, b.dataset.client, b.dataset.rule);
        render();
      }));
    } else {
      body().innerHTML = requestsView(events);
      wireRequests(render);
    }
  };
  every(2000, async () => {
    [p, events] = await Promise.all([api(`/api/projects/${id}`), api(`/api/projects/${id}/events?limit=2000`)]);
    if (!document.activeElement || document.activeElement.id !== "f-text") render();
  });
}

function localPage() {
  every(2000, async () => {
    const events = await api("/api/local-events?limit=2000");
    const render = () => {
      app.innerHTML = `<div class="bar"><h2>Local events</h2></div>
        <p class="muted">From guards running without a project key (written to ~/.mcpwatch/events.jsonl).</p>${requestsView(events)}`;
      wireRequests(render);
    };
    if (!document.activeElement || document.activeElement.id !== "f-text") render();
  });
}

function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  if (parts[0] === "new") return newProjectPage();
  if (parts[0] === "local") return localPage();
  if (parts[0] === "p" && parts[1]) return projectPage(parts[1], parts[2] || "requests");
  return projectsPage();
}

let signedIn = false;

async function start(user) {
  try {
    meta = await api("/api/meta");
  } catch (e) {
    if (e.message === "sign in required") return;
    app.innerHTML = `<div class="card empty">Could not load the dashboard (${esc(e.message)}).<br>
      If you just updated MCPWatch, restart it: stop the running <span class="mono">mcpwatch dashboard</span> (Ctrl+C) and start it again.</div>`;
    return;
  }
  signedIn = true;
  meta.rules.forEach((r) => (rules[r.id] = r));
  document.getElementById("hint").textContent = meta.server;
  showUser(user);
  route();
}

document.getElementById("logout").onclick = async () => {
  await api("/api/auth/logout", { method: "POST" }).catch(() => {});
  signedIn = false;
  location.hash = "#/";
  authPage();
};

window.addEventListener("hashchange", () => { open.clear(); if (signedIn) route(); });
(async () => {
  let me;
  try {
    me = await api("/api/auth/me");
  } catch (e) {
    app.innerHTML = `<div class="card empty">Could not reach the dashboard server (${esc(e.message)}).<br>
      If you just updated MCPWatch, restart it: stop the running <span class="mono">mcpwatch dashboard</span> (Ctrl+C) and start it again.</div>`;
    return;
  }
  me.user ? start(me.user) : authPage();
})();
</script>
</body>
</html>
