[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vedhaai-mcpwatch"
version = "0.1.0"
description = "Security guard for MCP servers in Python: the official MCP SDK, Django, Flask, FastAPI, any ASGI or WSGI app"
readme = "README.md"
license = "ISC"
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "security", "guard", "django", "flask", "fastapi", "prompt-injection"]
classifiers = [
  "Framework :: Django",
  "Framework :: Flask",
  "Framework :: FastAPI",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
# The MCP SDK hook needs the SDK; the HTTP middleware needs nothing.
mcp = ["mcp>=1.10"]
test = ["mcp>=1.10", "flask>=3", "django>=4.2", "pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/vedhaai/MCP-Watch#python"
Repository = "https://github.com/vedhaai/MCP-Watch"

[tool.hatch.build.targets.wheel]
packages = ["mcpwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
