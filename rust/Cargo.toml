[package]
name = "mcpwatch"
version = "0.1.0"
edition = "2024"
# Current stable. This is the *minimum* a user needs, so raising it narrows who can install the
# crate; the code itself only needs 1.88, which is also rmcp's own floor.
rust-version = "1.100"
description = "Security guard for MCP servers in Rust: the official Rust SDK (rmcp), axum/tower, actix-web"
readme = "README.md"
license = "MIT"
repository = "https://github.com/vedhaai/MCP-Watch"
homepage = "https://github.com/vedhaai/MCP-Watch#rust"
documentation = "https://docs.rs/mcpwatch"
keywords = ["mcp", "model-context-protocol", "security", "guard", "prompt-injection"]
categories = ["network-programming", "web-programming", "development-tools"]
# Keep the published archive to the crate itself: the integration tests need the
# repository's Node engine, which is not part of this package.
exclude = ["tests/"]

[features]
# The tower layer, not the SDK guard, because `rmcp` has changed major version three times in 73
# releases. A default-on `rmcp` would put our 3.x beside a user's 4.x the day that lands, and
# `GuardedTransport` would implement the wrong crate's `Transport` for people who never asked for
# it. The Java package makes the MCP SDK `provided` scope for the same reason; an optional feature
# that is off by default is Cargo's nearest equivalent.
default = ["tower"]
# The official Rust MCP SDK: guards a server transport. `io-std` is what `guard_stdio` needs.
rmcp = ["dep:rmcp", "tokio/io-std"]
# A tower layer, for axum and anything else that speaks tower.
tower = ["dep:tower", "dep:http", "dep:http-body", "dep:http-body-util", "dep:bytes", "dep:pin-project-lite"]
# actix-web middleware, over the same framework-free HTTP guard.
actix = ["dep:actix-web", "dep:futures", "dep:bytes"]
# The `mcpwatch-proxy` binary: guards a server whose code you cannot change.
proxy = []

[dependencies]
# The sidecar protocol is JSON lines, and the engine's options are a JSON object.
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
# Process supervision, the pipes to the engine, and the per-direction queues.
tokio = { version = "1.48.0", features = ["process", "io-util", "sync", "rt", "time", "macros"] }
# Warnings about a guard that cannot reach its engine must reach the host's logs,
# whatever the host uses. `log` is the Rust equivalent of the Java package's SLF4J:
# a facade, with no implementation forced on the application.
log = "0.4.28"

rmcp = { version = "3.10.0", optional = true, default-features = false, features = ["server"] }
futures = { version = "0.3.31", optional = true }
tower = { version = "0.5.2", optional = true, default-features = false }
http = { version = "1.3.1", optional = true }
http-body = { version = "1.0.1", optional = true }
http-body-util = { version = "0.1.3", optional = true }
bytes = { version = "1.10.1", optional = true }
pin-project-lite = { version = "0.2.16", optional = true }
actix-web = { version = "4.11.0", optional = true, default-features = false }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["full"] }

[[bin]]
name = "mcpwatch-proxy"
path = "src/bin/mcpwatch_proxy.rs"
required-features = ["proxy"]

[package.metadata.docs.rs]
# Every adapter should be visible on docs.rs, not just the default feature.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
