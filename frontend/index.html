<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCPWatch</title>
<script>
  // Apply the saved light / dark choice before React loads, so the page doesn't flash the other theme.
  try {
    let mode = localStorage.getItem("mui-mode") || "system";
    if (mode === "system") mode = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.classList.add(mode);
  } catch {}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
